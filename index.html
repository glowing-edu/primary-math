                        <div class="flex justify-center items-center gap-3 text-lg font-black">
                            <span class="text-amber-600">${q.ones}</span>
                            <span>+</span>
                            <span class="bg-amber-200 text-amber-900 px-3 py-1 rounded-xl animate-pulse">${q.remain}</span>
                            <span>=</span>
                            <span class="text-rose-600">${q.subtrahend}</span>
                        </div>
                        <p class="text-xs text-slate-600">${q.minuend} - ${q.ones} = 10，然後再減 ${q.remain}</p>
                    </div>
                `;

                prompt = `我哋用平十法。${q.subtrahend} 可以分成 ${q.ones} 同幾多呀？`;
                renderMultipleChoiceOptions(q.remain, 1, 9, optionsBox);
            } else {
                q.ans = q.total;
                renderPingTenDiagram(q, step, `而家用 <strong class="text-purple-700">10</strong> 減 <strong class="text-amber-600">${q.remain}</strong>，等於幾多？`);

                currentHintSpeechText = `10 減 ${q.remain} 等於 ${q.total}。所以 ${q.minuend} 減 ${q.subtrahend} 等於 ${q.total}。`;
                document.getElementById('hint-content').innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <p class="text-sm">先減 ${q.ones} 到 10，再減 ${q.remain}</p>
                        <p class="text-base font-black text-purple-700">10 - ${q.remain} = <span class="text-emerald-700">${q.total}</span></p>
                        <p class="text-sm font-black text-slate-700">${q.minuend} - ${q.subtrahend} = ${q.total}</p>
                    </div>
                `;

                prompt = `而家用 10 減 ${q.remain}，等於幾多呀？`;
                renderMultipleChoiceOptions(q.total, 1, 9, optionsBox);
            }

            requestAnimationFrame(() => layoutPingTenDiagram());

            setTimeout(() => {
                const game = document.getElementById('game-screen');
                if (currentQuestion === q && currentQuestion.step === step && game && !game.classList.contains('hidden')) {
                    speakCantonese(prompt);
                }
            }, 350);
        }

        function renderPingTenDiagram(q, step, instruction) {
            const formulaBox = document.getElementById('formula-container');
            const visualArea = document.getElementById('visual-area');
            if (!formulaBox || !visualArea) return;

            formulaBox.innerHTML = `
                <span class="text-rose-600">${q.minuend}</span>
                <span class="text-rose-500">-</span>
                <span>${q.subtrahend}</span>
                <span class="text-slate-400">=</span>
                <span class="inline-block border-b-4 border-dashed border-rose-400 w-16 text-center text-rose-600">?</span>
            `;

            const stepBadge = `
                <div class="flex items-center gap-1.5" aria-label="第 ${step} 步，共 2 步">
                    ${[1, 2].map((n) => `
                        <span class="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black ${
                            n === step ? 'bg-indigo-500 text-white' : n < step ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'
                        }">${n < step ? '✓' : n}</span>
                    `).join('')}
                </div>
            `;

            const part1 = `<span data-pt="part1" class="border-2 border-transparent bg-amber-200 text-amber-900 ring-2 ring-amber-300 font-black text-xl px-4 py-1.5 rounded-xl shadow">${q.ones}</span>`;
            const part2 = step >= 2
                ? `<span data-pt="part2" class="border-2 border-transparent bg-amber-200 text-amber-900 ring-2 ring-amber-300 font-black text-xl px-4 py-1.5 rounded-xl shadow">${q.remain}</span>`
                : `<span data-pt="part2" class="bg-white border-2 border-dashed border-amber-400 text-amber-500 font-black text-xl px-4 py-1.5 rounded-xl animate-pulse">?</span>`;

            // Step 2 shows the two-subtraction chain:
            //   12 − 2 = 10, then 10 − 3 = ?
            const bracketLayer = step >= 2
                ? `
                    <span id="pt-minus" class="absolute z-10 text-rose-500 font-black text-2xl leading-none" aria-hidden="true">−</span>
                    <span data-pt="ten" class="absolute z-10 bg-purple-200 text-purple-900 ring-2 ring-purple-300 font-black text-xl px-3 py-1.5 rounded-xl shadow">10</span>
                    <span id="pt-minus2" class="absolute z-10 text-rose-500 font-black text-2xl leading-none" aria-hidden="true">−</span>
                    <span data-pt="total" class="absolute z-10 bg-white border-2 border-dashed border-emerald-300 text-emerald-400 font-black text-xl px-4 py-1.5 rounded-xl animate-pulse">?</span>
                `
                : '';

            visualArea.innerHTML = `
                <div class="flex flex-col items-center gap-3 w-full">
                    ${stepBadge}
                    <p class="text-xs md:text-sm font-bold text-slate-500 text-center">${instruction}</p>
                    <div id="pt-diagram" data-step="${step}" class="relative flex flex-col items-center px-6 pt-1">
                        <div id="pt-eq" class="flex items-center gap-2 md:gap-3 text-3xl md:text-4xl font-black">
                            <span data-pt="minuend" class="text-rose-600 bg-rose-50 ring-2 ring-rose-200 px-1.5 rounded-xl">${q.minuend}</span>
                            <span class="text-rose-500">-</span>
                            <span data-pt="subtrahend" class="text-slate-700 px-1.5 rounded-xl">${q.subtrahend}</span>
                            <span class="text-slate-400">=</span>
                            <span class="text-slate-400 px-1.5">?</span>
                        </div>
                        <div id="pt-bond" class="relative mt-5 flex flex-col items-center">
                            <div class="flex items-start gap-5 sm:gap-6">${part1}${part2}</div>
                        </div>
                        <!-- Keep the bracket area reserved from step 1 so the
                             layout does not jump after the first pick. -->
                        <div class="h-44" aria-hidden="true"></div>
                        ${bracketLayer}
                        <svg id="pt-lines" class="pointer-events-none absolute inset-0 overflow-visible" aria-hidden="true"></svg>
                    </div>
                </div>
            `;
        }

        function layoutPingTenDiagram() {
            const diagram = document.getElementById('pt-diagram');
            if (!diagram) return;
            const minuend = diagram.querySelector('[data-pt="minuend"]');
            const subtrahend = diagram.querySelector('[data-pt="subtrahend"]');
            const bond = document.getElementById('pt-bond');
            const part1 = diagram.querySelector('[data-pt="part1"]');
            const part2 = diagram.querySelector('[data-pt="part2"]');
            const ten = diagram.querySelector('[data-pt="ten"]');
            const total = diagram.querySelector('[data-pt="total"]');
            const minus = document.getElementById('pt-minus');
            const minus2 = document.getElementById('pt-minus2');
            const svg = document.getElementById('pt-lines');
            if (!minuend || !subtrahend || !bond || !part1 || !part2 || !svg) return;

            // The bond sits under the subtrahend.
            bond.style.transform = 'none';
            const dr = diagram.getBoundingClientRect();
            const sr0 = subtrahend.getBoundingClientRect();
            const dx = (sr0.left + sr0.width / 2) - (dr.left + dr.width / 2);
            bond.style.transform = `translateX(${dx}px)`;

            const dr3 = diagram.getBoundingClientRect();
            const w = Math.ceil(dr3.width);
            const h = Math.ceil(dr3.height);
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
            svg.setAttribute('width', String(w));
            svg.setAttribute('height', String(h));

            const rel = (r) => ({
                top: r.top - dr3.top,
                bottom: r.bottom - dr3.top,
                cx: r.left - dr3.left + r.width / 2,
            });
            const m = rel(minuend.getBoundingClientRect());
            const s = rel(subtrahend.getBoundingClientRect());
            const p1 = rel(part1.getBoundingClientRect());
            const p2 = rel(part2.getBoundingClientRect());

            // Straight /\ lines from the subtrahend down to its two parts.
            const root = { x: s.cx, y: s.bottom + 2 };
            const bondLine = (leaf) => `<path d="M ${root.x} ${root.y} L ${leaf.cx} ${leaf.top}" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />`;
            let paths = bondLine(p1) + bondLine(p2);

            // Step 2 shows the subtraction chain with two |_| brackets:
            //   12 − 2 = 10   joins the minuend and the first part
            //   10 − 3 = ?    joins the new 10 and the remaining part
            if (ten && total && minus && minus2) {
                const bracket = (leftX, leftTop, rightX, rightTop, barY) =>
                    `<path d="M ${leftX} ${leftTop} L ${leftX} ${barY} L ${rightX} ${barY} L ${rightX} ${rightTop}" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;

                const bar1Y = Math.max(m.bottom, p1.bottom) + 28;
                const left1X = m.cx;
                const right1X = p1.cx;
                const mid1X = (left1X + right1X) / 2;

                minus.style.left = `${mid1X}px`;
                minus.style.top = `${bar1Y - 8}px`;
                minus.style.transform = 'translate(-50%, -100%)';

                ten.style.left = `${mid1X}px`;
                ten.style.top = `${bar1Y + 10}px`;
                ten.style.transform = 'translateX(-50%)';

                const t = rel(ten.getBoundingClientRect());
                const bar2Y = Math.max(t.bottom, p2.bottom) + 28;
                const left2X = t.cx;
                const right2X = p2.cx;
                const mid2X = (left2X + right2X) / 2;

                minus2.style.left = `${mid2X}px`;
                minus2.style.top = `${bar2Y - 8}px`;
                minus2.style.transform = 'translate(-50%, -100%)';

                total.style.left = `${mid2X}px`;
                total.style.top = `${bar2Y + 10}px`;
                total.style.transform = 'translateX(-50%)';

                paths += bracket(left1X, m.bottom + 4, right1X, p1.bottom + 4, bar1Y);
                paths += bracket(left2X, t.bottom + 4, right2X, p2.bottom + 4, bar2Y);
            }

            svg.innerHTML = paths;
        }

        // --- HELPER: RENDER MULTIPLE CHOICE BUTTONS ---
        function renderMultipleChoiceOptions(correctAns, minVal, maxVal, container) {
            let options = new Set();
            options.add(correctAns);

            // Prefer distractors close to the answer, but bail out after a while:
            // when the answer sits outside [minVal, maxVal] there may be very few
            // valid nearby values, and an unbounded loop would freeze the page.
            let guard = 0;
            while (options.size < 4 && guard < 60) {
                guard += 1;
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                let dummy = correctAns + offset;
                if (dummy >= minVal && dummy <= maxVal && dummy !== correctAns) {
                    options.add(dummy);
                }
            }

            // Fallback: fill any remaining slots from the whole allowed range.
            for (let v = minVal; v <= maxVal && options.size < 4; v += 1) {
                options.add(v);
            }

            const sortedOptions = Array.from(options).sort((a, b) => a - b);

            container.innerHTML = sortedOptions.map(opt => `
                <button onclick="checkAnswer(${opt}, this)" class="bounce-btn bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-black text-xl md:text-2xl py-3 rounded-2xl shadow-md border-b-4 border-sky-700 transition">
                    ${opt}
                </button>
            `).join('');
        }

        // --- ANSWER CHECKING & FEEDBACK ---
        function setPointNote(show) {
            const note = document.getElementById('point-note');
            if (note) note.classList.toggle('hidden', !show);
        }

        // Answer buttons swap their whole colour set, including the hover and
        // active variants. Without that, a correct button would keep its sky
        // hover colour under the pointer and only the border would turn green.
        const ANSWER_TONE_CLASSES = {
            sky: ['bg-sky-500', 'hover:bg-sky-600', 'active:bg-sky-700', 'border-sky-700'],
            emerald: ['bg-emerald-500', 'hover:bg-emerald-600', 'active:bg-emerald-700', 'border-emerald-700'],
            rose: ['bg-rose-500', 'hover:bg-rose-600', 'active:bg-rose-700', 'border-rose-700'],
        };

        function setAnswerButtonTone(btnEl, tone) {
            btnEl.classList.remove(
                ...ANSWER_TONE_CLASSES.sky,
                ...ANSWER_TONE_CLASSES.emerald,
                ...ANSWER_TONE_CLASSES.rose
            );
            btnEl.classList.add(...ANSWER_TONE_CLASSES[tone]);
        }

        // Preparation levels ask several picks before the real answer.
        function prepStepCount(kind) {
            if (kind === 'makeTenPrep' || kind === 'breakTenPrep') return 3;
            if (kind === 'pingTenPrep') return 2;
            return 0;
        }

        function checkAnswer(selected, btnEl) {
            if (answerLocked) return;
            answerLocked = true;

            const question = currentQuestion;
            const prepSteps = question ? prepStepCount(question.kind) : 0;
            const isMultiStep = prepSteps > 0;
            const step = isMultiStep ? question.step : 0;
            const isFinalStep = !isMultiStep || step >= prepSteps;

            if (selected === question.ans) {
                playSound('correct');

                // The preparation levels have several picks. Earlier picks only
                // move to the next step; the point is decided by the final
                // answer, and still requires no wrong answer or hint.
                if (isMultiStep && !isFinalStep) {
                    setAnswerButtonTone(btnEl, 'emerald');

                    setTimeout(() => {
                        const game = document.getElementById('game-screen');
                        if (currentQuestion !== question || question.step !== step) return;
                        if (game && game.classList.contains('hidden')) return;
                        if (question.kind === 'makeTenPrep') {
                            renderMakeTenPrepStep(step + 1);
                        } else if (question.kind === 'breakTenPrep') {
                            renderBreakTenPrepStep(step + 1);
                        } else {
                            renderPingTenPrepStep(step + 1);
                        }
                    }, 650);
                    return;
                }

                // Show the completed answer in the diagram before moving on.
                if (isMultiStep && isFinalStep) {
                    const totalLeaf = document.querySelector('[data-bt="total"], [data-pt="total"], [data-mt="total"]');
                    if (totalLeaf) {
                        totalLeaf.textContent = String(question.ans);
                        totalLeaf.className = 'absolute z-10 bg-emerald-200 text-emerald-900 ring-2 ring-emerald-300 font-black text-xl px-4 py-1.5 rounded-xl shadow';
                    }
                }

                // A question only earns a point if the child got it right on the
                // first try without opening the hint.
                if (!questionMissed && !questionHintUsed) {
                    score += 1;
                    document.getElementById('score-count').innerText = score;
                    setPointNote(false);
                }

                if (window.GameProgress) {
                    window.GameProgress.record(currentStage, true);
                }
                updateLocalProgress(true);

                // Confetti animation
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.8 }
                });

                setAnswerButtonTone(btnEl, 'emerald');

                // Auto next question after short delay
                setTimeout(() => {
                    loadQuestion();
                }, isMultiStep ? 1600 : 1200);

            } else {
                playSound('wrong');
                questionMissed = true;
                setPointNote(true);

                // Preparation substeps are part of one question, so only the final
                // pick counts toward the level's answer stats.
                if (isFinalStep) {
                    if (window.GameProgress) {
                        window.GameProgress.record(currentStage, false);
                    }
                    updateLocalProgress(false);
                }

                btnEl.classList.add('animate-shake');
                setAnswerButtonTone(btnEl, 'rose');

                setTimeout(() => {
                    btnEl.classList.remove('animate-shake');
                    // Keep the wrong pick red for the rest of this question or
                    // step, and stop it from being chosen again.
                    btnEl.disabled = true;
                    btnEl.classList.add('cursor-not-allowed');
                    answerLocked = false;
                }, 800);
            }
        }

        // --- HINT TOGGLE & VOICE TRIGGER ---
        function toggleHint() {
            playSound('click');
            const drawer = document.getElementById('hint-drawer');
            if (drawer.classList.contains('hidden')) {
                // Opening the hint forfeits this question's point.
                questionHintUsed = true;
                setPointNote(true);
                drawer.classList.remove('hidden');
                speakHintText();
            } else {
                drawer.classList.add('hidden');
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        function hideHint() {
            const drawer = document.getElementById('hint-drawer');
            drawer.classList.add('hidden');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    </script>

    <!-- Multi-profile progress + Puter cloud sync -->
