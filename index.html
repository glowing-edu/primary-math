<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幼兒數學大冒險 - 5步學會加減法算理</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Puter.js (cloud progress sync) -->
    <script src="https://js.puter.com/v2/"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Fredoka & Noto Sans TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            touch-action: manipulation;
        }

        .ten-frame-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
        }

        .dot-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .bounce-btn {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .bounce-btn:active {
            transform: scale(0.95);
        }

        .math-tree-line {
            stroke: #94a3b8;
            stroke-width: 3;
            stroke-dasharray: 4;
        }

        /* Speech Bubble Pulse */
        .hint-pulse {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-6 text-slate-800">

    <!-- Header Navigation & Stage Selector -->
    <header class="max-w-4xl w-full mx-auto bg-white/90 backdrop-blur-md rounded-3xl p-4 shadow-lg border-4 border-sky-200 mb-4">
        <div class="flex flex-col gap-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-amber-400 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md transform -rotate-6">
                        <i class="fa-solid fa-shapes"></i>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-black text-sky-600 tracking-wide">幼兒數學大冒險</h1>
                        <p class="text-xs text-slate-500 font-bold">5歲專屬心算與算理啟蒙遊戲</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <!-- Puter cloud sync (injected by src/main.js) -->
                    <div id="cloud-sync-root"></div>
                    <!-- Multi-profile switcher (injected by src/main.js) -->
                    <div id="profile-root"></div>
                </div>
            </div>

            <!-- Stage Badges Nav -->
            <div class="flex items-center gap-1.5 overflow-x-auto max-w-full pb-1" id="stage-nav">
                <!-- Dynamic stage buttons will be injected here -->
            </div>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="max-w-4xl w-full mx-auto flex-1 bg-white rounded-3xl shadow-xl border-4 border-sky-100 p-4 md:p-8 flex flex-col justify-between relative overflow-hidden">
        
        <!-- Stage Title Banner -->
        <div class="flex justify-between items-center border-b-2 border-slate-100 pb-3 mb-4">
            <div class="flex items-center gap-2">
                <span id="stage-number-badge" class="bg-sky-500 text-white font-black px-3 py-1 rounded-full text-sm">階段 1</span>
                <h2 id="stage-title" class="text-lg md:text-xl font-bold text-slate-700">10的組成與分解</h2>
            </div>
            <!-- Stars score display -->
            <div class="flex items-center gap-2 bg-amber-50 px-4 py-1.5 rounded-full border border-amber-200">
                <i class="fa-solid fa-star text-amber-400 text-lg"></i>
                <span id="score-count" class="font-black text-amber-600 text-lg">0</span>
            </div>
        </div>

        <!-- Question Display & Interactive Playground -->
        <div class="flex-1 flex flex-col items-center justify-center my-2">
            
            <!-- Dynamic Math Formula Header -->
            <div id="formula-container" class="flex items-center justify-center gap-3 text-3xl md:text-5xl font-black text-slate-700 mb-6 bg-slate-50 px-6 py-4 rounded-2xl border-2 border-slate-200 shadow-inner min-h-[90px] w-full max-w-md">
                <!-- Dynamic formula html -->
            </div>

            <!-- Visual 10-Frame / Visualization Canvas Container -->
            <div id="visual-area" class="w-full flex flex-col items-center justify-center my-2 min-h-[160px]">
                <!-- Dynamic 10-frame visual component -->
            </div>

            <!-- Visual Breakdown Hint Drawer (Hidden by default, toggled by 💡 button) -->
            <div id="hint-drawer" class="hidden w-full max-w-lg bg-amber-50 rounded-2xl border-2 border-amber-300 p-4 my-3 text-slate-700 shadow-md">
                <div class="flex items-center justify-between mb-2 border-b border-amber-200 pb-2">
                    <div class="flex items-center gap-2 text-amber-700 font-bold">
                        <i class="fa-solid fa-lightbulb text-amber-500 animate-bounce"></i>
                        <span>解題小秘訣（粵語講解）</span>
                    </div>
                    <button id="replay-speech-btn" onclick="speakHintText()" class="text-xs bg-amber-200 hover:bg-amber-300 text-amber-800 font-bold px-3 py-1 rounded-full flex items-center gap-1 transition">
                        <i class="fa-solid fa-volume-high"></i> 重播語音
                    </button>
                </div>
                <!-- Dynamic Hint Diagram / Text -->
                <div id="hint-content" class="flex flex-col items-center justify-center text-sm md:text-base font-bold text-amber-900">
                    <!-- Injected visual hint breakdown -->
                </div>
            </div>

        </div>

        <!-- User Answer Input Options / Keypad -->
        <div class="w-full max-w-md mx-auto mt-4">
            <!-- Hint Button and Options wrapper -->
            <div class="flex items-center gap-3">
                <!-- Hint Button -->
                <button id="hint-btn" onclick="toggleHint()" class="hint-pulse bounce-btn bg-amber-400 hover:bg-amber-500 text-white font-black p-4 rounded-2xl shadow-lg border-b-4 border-amber-600 flex flex-col items-center justify-center gap-1 text-xs shrink-0">
                    <i class="fa-solid fa-lightbulb text-2xl"></i>
                    <span>提示</span>
                </button>

                <!-- Options / Multi-choice Grid or Number Keypad -->
                <div id="answer-options" class="grid grid-cols-4 gap-2 flex-1">
                    <!-- Dynamic Answer Buttons -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Feedback & Credits -->
    <footer class="max-w-4xl w-full mx-auto text-center mt-3 text-xs text-slate-500 font-medium">
        廣東話語音支援 · 依據5歲幼兒認知發展設計
    </footer>

    <!-- Audio Effects (Web Audio API Synthesizer) -->
    <script>
        // Web Audio API Context for sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }
    </script>

    <!-- Game Engine & Cantonese Speech Logic -->
    <script>
        // --- STAGE DEFINITIONS ---
        const STAGES = [
            { id: 1, name: "10的組成與分解", desc: "湊十好朋友", badge: "階段 1" },
            { id: 2, name: "合十法（湊十法）", desc: "加法進位心算", badge: "階段 2" },
            { id: 3, name: "破十法", desc: "減法破十心算", badge: "階段 3" },
            { id: 4, name: "平十法", desc: "減法連續減到10", badge: "階段 4" },
            { id: 5, name: "借十法", desc: "直式退位減法筆算", badge: "階段 5" }
        ];

        let currentStage = 1;
        let currentQuestion = null;
        let score = 0;
        let currentHintSpeechText = "";
        let answerLocked = false;

        // --- SAVED PROGRESS BRIDGE (multi-profile + Puter sync) ---
        function getGameScore() {
            return score;
        }
        window.getGameScore = getGameScore;

        // Restore a profile's progress into the running game.
        function applySavedProgress(saved) {
            const p = saved || {};
            score = Math.max(0, Number(p.score) || 0);
            currentStage = Math.min(STAGES.length, Math.max(1, Number(p.lastStage) || 1));
            answerLocked = false;
            const scoreEl = document.getElementById('score-count');
            if (scoreEl) scoreEl.innerText = score;
            if (document.getElementById('stage-nav')) {
                renderStageNav();
                loadQuestion();
            }
        }
        window.applySavedProgress = applySavedProgress;

        // --- WEB SPEECH API (CANTONESE) ---
        let cantoneseVoice = null;

        function initVoices() {
            if ('speechSynthesis' in window) {
                const updateVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    // Search specifically for Cantonese voice (zh-HK, Cantonese, or Hong Kong)
                    cantoneseVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue') || v.name.includes('Cantonese') || v.name.includes('Hong Kong')) ||
                                     voices.find(v => v.lang.startsWith('zh')) || null;
                };
                updateVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = updateVoices;
                }
            }
        }
        initVoices();

        function speakCantonese(text) {
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // stop previous speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.85; // slightly slower for 5yo child
            utterance.pitch = 1.1; // friendly warmer tone

            if (cantoneseVoice) {
                utterance.voice = cantoneseVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakHintText() {
            if (currentHintSpeechText) {
                speakCantonese(currentHintSpeechText);
            }
        }

        // --- GAME INIT & NAVIGATION ---
        window.onload = function() {
            if (window.PrimaryMathApp && typeof window.PrimaryMathApp.boot === 'function') {
                window.PrimaryMathApp.boot();
            } else {
                renderStageNav();
                loadQuestion();
            }
        };

        function renderStageNav() {
            const nav = document.getElementById('stage-nav');
            nav.innerHTML = STAGES.map(s => `
                <button onclick="changeStage(${s.id})" class="px-3 py-1.5 rounded-xl font-bold text-xs whitespace-nowrap transition bounce-btn flex items-center gap-1 ${currentStage === s.id ? 'bg-sky-500 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    <span>${s.id}. ${s.name}</span>
                </button>
            `).join('');

            document.getElementById('stage-number-badge').innerText = `階段 ${currentStage}`;
            document.getElementById('stage-title').innerText = STAGES[currentStage - 1].name;
        }

        function changeStage(stageId) {
            playSound('click');
            currentStage = stageId;
            hideHint();
            renderStageNav();
            loadQuestion();
            if (window.GameProgress) {
                window.GameProgress.setStage(stageId);
            }
        }

        // --- QUESTION GENERATORS FOR EACH STAGE ---
        function loadQuestion() {
            answerLocked = false;
            hideHint();
            const formulaBox = document.getElementById('formula-container');
            const visualArea = document.getElementById('visual-area');
            const optionsBox = document.getElementById('answer-options');

            switch(currentStage) {
                case 1:
                    generateStage1(formulaBox, visualArea, optionsBox);
                    break;
                case 2:
                    generateStage2(formulaBox, visualArea, optionsBox);
                    break;
                case 3:
                    generateStage3(formulaBox, visualArea, optionsBox);
                    break;
                case 4:
                    generateStage4(formulaBox, visualArea, optionsBox);
                    break;
                case 5:
                    generateStage5(formulaBox, visualArea, optionsBox);
                    break;
            }
        }

        // --- STAGE 1: 10的組成與分解 ---
        function generateStage1(formulaBox, visualArea, optionsBox) {
            const a = Math.floor(Math.random() * 9) + 1; // 1 to 9
            const target = 10 - a;
            currentQuestion = { ans: target, a: a };

            formulaBox.innerHTML = `
                <span>${a}</span>
                <span class="text-sky-500">+</span>
                <span class="inline-block border-b-4 border-dashed border-sky-400 w-12 text-center text-sky-500">?</span>
                <span class="text-slate-400">=</span>
                <span class="text-amber-500 font-extrabold">10</span>
            `;

            // 10 Frame render
            let dotsHtml = '';
            for (let i = 0; i < 10; i++) {
                if (i < a) {
                    dotsHtml += `<div class="bg-sky-400 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-inner dot-pop"><i class="fa-solid fa-circle"></i></div>`;
                } else {
                    dotsHtml += `<div class="bg-slate-100 border-2 border-dashed border-slate-300 rounded-full flex items-center justify-center text-slate-300">?</div>`;
                }
            }

            visualArea.innerHTML = `
                <div class="flex flex-col items-center gap-2">
                    <p class="text-xs font-bold text-slate-500">十格陣：已有 ${a} 個藍點，還差幾個填滿 10？</p>
                    <div class="ten-frame-grid w-64 h-28 bg-white border-4 border-slate-300 rounded-2xl p-2 shadow-md">
                        ${dotsHtml}
                    </div>
                </div>
            `;

            currentHintSpeechText = `${a} 同幾多湊成 10 呢？睇下十格陣入面，仲有 ${target} 個空格未填滿。所以 ${a} 加 ${target} 等於 10！`;
            
            // Build visual hint diagram
            document.getElementById('hint-content').innerHTML = `
                <div class="text-center space-y-2">
                    <p class="text-sm">把 10 分解成兩部分：</p>
                    <div class="flex justify-center items-center gap-4 text-lg font-black">
                        <span class="text-sky-600">${a}</span>
                        <span>+</span>
                        <span class="text-amber-600 bg-amber-200 px-3 py-1 rounded-xl animate-pulse">${target}</span>
                        <span>= 10</span>
                    </div>
                </div>
            `;

            renderMultipleChoiceOptions(target, 1, 9, optionsBox);
        }

        // --- STAGE 2: 合十法 (湊十法) ---
        function generateStage2(formulaBox, visualArea, optionsBox) {
            const num1 = Math.floor(Math.random() * 3) + 7; // 7, 8, 9 (Big number)
            const num2 = Math.floor(Math.random() * 4) + 4; // 4, 5, 6, 7
            const ans = num1 + num2;
            const splitNeeded = 10 - num1; // what num2 needs to give to num1
            const remain = num2 - splitNeeded;

            currentQuestion = { ans: ans, num1: num1, num2: num2, splitNeeded: splitNeeded, remain: remain };

            formulaBox.innerHTML = `
                <span>${num1}</span>
                <span class="text-emerald-500">+</span>
                <span>${num2}</span>
                <span class="text-slate-400">=</span>
                <span class="inline-block border-b-4 border-dashed border-emerald-400 w-16 text-center text-emerald-600">?</span>
            `;

            // Render Two 10-Frames
            let frame1 = '';
            for (let i = 0; i < 10; i++) {
                if (i < num1) {
                    frame1 += `<div class="bg-sky-400 rounded-full flex items-center justify-center text-white text-xs dot-pop"><i class="fa-solid fa-circle"></i></div>`;
                } else {
                    frame1 += `<div class="bg-slate-100 border-2 border-dashed border-amber-300 rounded-full flex items-center justify-center text-amber-400 text-xs font-bold">+1</div>`;
                }
            }

            let frame2 = '';
            for (let i = 0; i < 10; i++) {
                if (i < num2) {
                    const isGivenAway = i < splitNeeded;
                    frame2 += `<div class="${isGivenAway ? 'bg-amber-400 ring-2 ring-amber-500' : 'bg-emerald-400'} rounded-full flex items-center justify-center text-white text-xs dot-pop"><i class="fa-solid fa-circle"></i></div>`;
                } else {
                    frame2 += `<div class="bg-slate-50 border border-slate-200 rounded-full"></div>`;
                }
            }

            visualArea.innerHTML = `
                <div class="flex flex-col sm:flex-row items-center gap-4">
                    <div class="flex flex-col items-center">
                        <span class="text-xs font-bold text-sky-600 mb-1 font-mono">${num1} (還差 ${splitNeeded} 湊成10)</span>
                        <div class="ten-frame-grid w-44 h-20 bg-white border-2 border-sky-300 rounded-xl p-1.5 shadow">
                            ${frame1}
                        </div>
                    </div>
                    <span class="text-xl font-bold text-slate-400">+</span>
                    <div class="flex flex-col items-center">
                        <span class="text-xs font-bold text-emerald-600 mb-1 font-mono">${num2} (拆出 ${splitNeeded} 和 ${remain})</span>
                        <div class="ten-frame-grid w-44 h-20 bg-white border-2 border-emerald-300 rounded-xl p-1.5 shadow">
                            ${frame2}
                        </div>
                    </div>
                </div>
            `;

            currentHintSpeechText = `合十法策略：先睇大數 ${num1}，仲差 ${splitNeeded} 就湊到 10。我哋將細數 ${num2} 拆開做 ${splitNeeded} 同 ${remain}。${num1} 加 ${splitNeeded} 變 10，10 再加剩返嘅 ${remain}，等於 ${ans}！`;

            document.getElementById('hint-content').innerHTML = `
                <div class="flex flex-col items-center gap-2">
                    <p>分小數，湊成十：</p>
                    <div class="flex items-center gap-6 text-base font-black">
                        <div>${num1}</div>
                        <div>+</div>
                        <div class="flex flex-col items-center">
                            <span class="text-emerald-600">${num2}</span>
                            <div class="text-xs text-amber-600 font-normal">↙ ↘</div>
                            <div class="flex gap-2 text-xs">
                                <span class="bg-amber-200 px-1.5 py-0.5 rounded text-amber-900 font-bold">${splitNeeded}</span>
                                <span class="bg-emerald-200 px-1.5 py-0.5 rounded text-emerald-900 font-bold">${remain}</span>
                            </div>
                        </div>
                    </div>
                    <p class="text-xs text-slate-600">第一步：${num1} + ${splitNeeded} = 10 ｜ 第二步：10 + ${remain} = <strong>${ans}</strong></p>
                </div>
            `;

            renderMultipleChoiceOptions(ans, 10, 18, optionsBox);
        }

        // --- STAGE 3: 破十法 ---
        function generateStage3(formulaBox, visualArea, optionsBox) {
            const ones = Math.floor(Math.random() * 4) + 1; // 1, 2, 3, 4
            const minuend = 10 + ones; // 11 to 14
            const subtrahend = Math.floor(Math.random() * 4) + (ones + 2); // greater than ones
            const ans = minuend - subtrahend;
            const tenMinusSub = 10 - subtrahend;

            currentQuestion = { ans: ans, minuend: minuend, subtrahend: subtrahend };

            formulaBox.innerHTML = `
                <span>${minuend}</span>
                <span class="text-rose-500">-</span>
                <span>${subtrahend}</span>
                <span class="text-slate-400">=</span>
                <span class="inline-block border-b-4 border-dashed border-rose-400 w-16 text-center text-rose-600">?</span>
            `;

            // Visual: 1 Bundle of 10 + loose ones
            visualArea.innerHTML = `
                <div class="flex items-center justify-center gap-6">
                    <!-- 10 Box -->
                    <div class="flex flex-col items-center">
                        <span class="text-xs font-bold text-purple-600 mb-1">整整齊齊 10 個</span>
                        <div class="ten-frame-grid w-40 h-20 bg-purple-50 border-2 border-purple-300 rounded-xl p-1.5 shadow">
                            ${Array(10).fill(0).map((_, idx) => `<div class="rounded-full ${idx < subtrahend ? 'bg-slate-300 line-through opacity-50' : 'bg-purple-500'} text-white text-[10px] flex items-center justify-center"><i class="fa-solid fa-circle"></i></div>`).join('')}
                        </div>
                        <span class="text-xs text-purple-700 font-bold mt-1">10 減 ${subtrahend} 剩 ${tenMinusSub}</span>
                    </div>

                    <span class="text-2xl font-black text-slate-300">+</span>

                    <!-- Single ones -->
                    <div class="flex flex-col items-center">
                        <span class="text-xs font-bold text-amber-600 mb-1">剩下的 ${ones} 個</span>
                        <div class="w-20 h-20 bg-amber-50 border-2 border-amber-300 rounded-xl p-2 flex flex-wrap gap-1 items-center justify-center shadow">
                            ${Array(ones).fill(0).map(() => `<div class="w-5 h-5 bg-amber-400 rounded-full flex items-center justify-center text-white text-[10px]"><i class="fa-solid fa-circle"></i></div>`).join('')}
                        </div>
                        <span class="text-xs text-amber-700 font-bold mt-1">個位 ${ones}</span>
                    </div>
                </div>
            `;

            currentHintSpeechText = `破十法策略：個位 ${ones} 唔夠減 ${subtrahend}。我哋拆開 ${minuend} 變成 10 同 ${ones}。用 10 減去 ${subtrahend} 剩返 ${tenMinusSub}，再加埋原先個位嘅 ${ones}，等於 ${ans}！`;

            document.getElementById('hint-content').innerHTML = `
                <div class="flex flex-col items-center gap-2">
                    <p>把被減數「破」開成 10 和幾：</p>
                    <div class="flex items-center gap-4 text-base font-black">
                        <div class="flex flex-col items-center">
                            <span class="text-purple-600">${minuend}</span>
                            <div class="text-xs text-purple-500 font-normal">↙ ↘</div>
                            <div class="flex gap-2 text-xs">
                                <span class="bg-purple-200 px-1.5 py-0.5 rounded text-purple-900 font-bold">10</span>
                                <span class="bg-amber-200 px-1.5 py-0.5 rounded text-amber-900 font-bold">${ones}</span>
                            </div>
                        </div>
                        <div>-</div>
                        <div class="text-rose-600">${subtrahend}</div>
                    </div>
                    <p class="text-xs text-slate-600">第一步：10 - ${subtrahend} = ${tenMinusSub} ｜ 第二步：${tenMinusSub} + ${ones} = <strong>${ans}</strong></p>
                </div>
            `;

            renderMultipleChoiceOptions(ans, 1, 9, optionsBox);
        }

        // --- STAGE 4: 平十法 ---
        function generateStage4(formulaBox, visualArea, optionsBox) {
            const ones = Math.floor(Math.random() * 4) + 2; // 2, 3, 4, 5
            const minuend = 10 + ones; // 12 to 15
            const subtrahend = ones + Math.floor(Math.random() * 3) + 2; // e.g. 13 - 5 (ones=3, subtrahend=5)
            const ans = minuend - subtrahend;
            const sub1 = ones; // first step minus to reach 10
            const sub2 = subtrahend - ones; // remaining minus

            currentQuestion = { ans: ans, minuend: minuend, subtrahend: subtrahend };

            formulaBox.innerHTML = `
                <span>${minuend}</span>
                <span class="text-indigo-500">-</span>
                <span>${subtrahend}</span>
                <span class="text-slate-400">=</span>
                <span class="inline-block border-b-4 border-dashed border-indigo-400 w-16 text-center text-indigo-600">?</span>
            `;

            visualArea.innerHTML = `
                <div class="flex flex-col items-center gap-2">
                    <p class="text-xs font-bold text-indigo-600">連續減：先減 ${sub1} 變整十 10，再減剩餘的 ${sub2}</p>
                    <div class="flex items-center gap-3 bg-indigo-50 p-3 rounded-2xl border border-indigo-200">
                        <div class="flex items-center gap-1 text-sm font-bold text-slate-700">
                            <span class="bg-white px-2 py-1 rounded shadow">${minuend}</span>
                            <i class="fa-solid fa-arrow-right text-indigo-400 text-xs"></i>
                            <span class="text-xs text-rose-500 font-mono">- ${sub1}</span>
                            <i class="fa-solid fa-arrow-right text-indigo-400 text-xs"></i>
                            <span class="bg-indigo-200 text-indigo-900 px-2 py-1 rounded shadow">10</span>
                            <i class="fa-solid fa-arrow-right text-indigo-400 text-xs"></i>
                            <span class="text-xs text-rose-500 font-mono">- ${sub2}</span>
                            <i class="fa-solid fa-arrow-right text-indigo-400 text-xs"></i>
                            <span class="bg-emerald-400 text-white px-2 py-1 rounded shadow font-black">${ans}</span>
                        </div>
                    </div>
                </div>
            `;

            currentHintSpeechText = `平十法策略：我們將減數 ${subtrahend} 拆開為 ${sub1} 同 ${sub2}。第一步：用 ${minuend} 減去 ${sub1}，正好平降到整十 10！第二步：再用 10 減去剩下的 ${sub2}，答案就是 ${ans}！`;

            document.getElementById('hint-content').innerHTML = `
                <div class="flex flex-col items-center gap-2">
                    <p>分小數，連續相減到 10：</p>
                    <div class="flex items-center gap-4 text-base font-black">
                        <div>${minuend}</div>
                        <div>-</div>
                        <div class="flex flex-col items-center">
                            <span class="text-indigo-600">${subtrahend}</span>
                            <div class="text-xs text-indigo-500 font-normal">↙ ↘</div>
                            <div class="flex gap-2 text-xs">
                                <span class="bg-indigo-200 px-1.5 py-0.5 rounded text-indigo-900 font-bold">${sub1}</span>
                                <span class="bg-rose-200 px-1.5 py-0.5 rounded text-rose-900 font-bold">${sub2}</span>
                            </div>
                        </div>
                    </div>
                    <p class="text-xs text-slate-600">第一步：${minuend} - ${sub1} = 10（平到10） ｜ 第二步：10 - ${sub2} = <strong>${ans}</strong></p>
                </div>
            `;

            renderMultipleChoiceOptions(ans, 1, 9, optionsBox);
        }

        // --- STAGE 5: 借十法 (直式退位筆算) ---
        function generateStage5(formulaBox, visualArea, optionsBox) {
            const tens = Math.floor(Math.random() * 3) + 2; // 2, 3, 4
            const ones = Math.floor(Math.random() * 4) + 1; // 1, 2, 3, 4
            const minuend = tens * 10 + ones; // e.g. 32
            const subtrahendOnes = Math.floor(Math.random() * 4) + (ones + 2); // > ones
            const subtrahendTens = Math.floor(Math.random() * (tens - 1)) + 1; // < tens
            const subtrahend = subtrahendTens * 10 + subtrahendOnes; // e.g. 15
            const ans = minuend - subtrahend;

            currentQuestion = { ans: ans, minuend: minuend, subtrahend: subtrahend };

            // Render Vertical Layout inside Formula Box
            formulaBox.innerHTML = `
                <div class="font-mono flex flex-col items-end text-3xl tracking-widest px-4 border-l-4 border-teal-400">
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-sans text-slate-400">十 個</span>
                    </div>
                    <div class="relative">
                        <span class="line-through text-slate-300 text-2xl absolute -top-3 left-0 font-sans">${tens}</span>
                        <span>${minuend}</span>
                    </div>
                    <div class="text-teal-600 border-b-4 border-slate-700 w-full text-right pb-1">
                        - ${subtrahend}
                    </div>
                    <div class="text-teal-600 font-black pt-1">
                        ?
                    </div>
                </div>
            `;

            visualArea.innerHTML = `
                <div class="flex items-center justify-center gap-4 bg-teal-50 p-3 rounded-2xl border border-teal-200">
                    <div class="text-center">
                        <span class="text-xs text-teal-700 font-bold block mb-1">直式退位筆算規則：</span>
                        <p class="text-xs text-slate-600">個位 <span class="text-rose-500 font-bold">${ones}</span> 不夠減 <span class="text-rose-500 font-bold">${subtrahendOnes}</span></p>
                        <p class="text-xs text-slate-600">向十位借 1 當 10，個位變成 <span class="text-teal-700 font-bold">${10 + ones}</span>！</p>
                    </div>
                </div>
            `;

            currentHintSpeechText = `借十法筆算：個位 ${ones} 唔夠減 ${subtrahendOnes}。向十位借 1 當 10！十位 ${tens} 借走 1 剩返 ${tens - 1}；個位變成 ${10 + ones}。用 ${10 + ones} 減 ${subtrahendOnes} 得 ${10 + ones - subtrahendOnes}，十位 ${tens - 1} 減 ${subtrahendTens} 得 ${tens - 1 - subtrahendTens}。答案係 ${ans}！`;

            document.getElementById('hint-content').innerHTML = `
                <div class="flex flex-col items-center gap-2">
                    <p class="text-sm font-bold text-teal-800">直式借十步驟：</p>
                    <ol class="text-xs text-slate-700 list-decimal list-inside space-y-1">
                        <li>個位 ${ones} < ${subtrahendOnes}，向十位借 1 個十。</li>
                        <li>十位 ${tens} 退 1 變成 <strong>${tens - 1}</strong>。</li>
                        <li>個位 10 + ${ones} = <strong>${10 + ones}</strong>。</li>
                        <li>個位：${10 + ones} - ${subtrahendOnes} = <strong>${(10 + ones) - subtrahendOnes}</strong></li>
                        <li>十位：${tens - 1} - ${subtrahendTens} = <strong>${(tens - 1) - subtrahendTens}</strong></li>
                    </ol>
                    <p class="text-sm font-black text-teal-700 mt-1">結果：${ans}</p>
                </div>
            `;

            renderMultipleChoiceOptions(ans, 10, 40, optionsBox);
        }

        // --- HELPER: RENDER MULTIPLE CHOICE BUTTONS ---
        function renderMultipleChoiceOptions(correctAns, minVal, maxVal, container) {
            let options = new Set();
            options.add(correctAns);

            while (options.size < 4) {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                let dummy = correctAns + offset;
                if (dummy >= minVal && dummy <= maxVal && dummy !== correctAns) {
                    options.add(dummy);
                }
            }

            const sortedOptions = Array.from(options).sort((a, b) => a - b);

            container.innerHTML = sortedOptions.map(opt => `
                <button onclick="checkAnswer(${opt}, this)" class="bounce-btn bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-black text-xl md:text-2xl py-3 rounded-2xl shadow-md border-b-4 border-sky-700 transition">
                    ${opt}
                </button>
            `).join('');
        }

        // --- ANSWER CHECKING & FEEDBACK ---
        function checkAnswer(selected, btnEl) {
            if (answerLocked) return;
            answerLocked = true;

            if (selected === currentQuestion.ans) {
                playSound('correct');
                score += 10;
                document.getElementById('score-count').innerText = score;

                if (window.GameProgress) {
                    window.GameProgress.record(currentStage, true);
                }

                // Confetti animation
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.8 }
                });

                btnEl.classList.remove('bg-sky-500', 'border-sky-700');
                btnEl.classList.add('bg-emerald-500', 'border-emerald-700');

                // Auto next question after short delay
                setTimeout(() => {
                    loadQuestion();
                }, 1200);

            } else {
                playSound('wrong');
                if (window.GameProgress) {
                    window.GameProgress.record(currentStage, false);
                }
                btnEl.classList.remove('bg-sky-500', 'border-sky-700');
                btnEl.classList.add('bg-rose-500', 'border-rose-700', 'animate-shake');

                setTimeout(() => {
                    btnEl.classList.remove('bg-rose-500', 'border-rose-700', 'animate-shake');
                    btnEl.classList.add('bg-sky-500', 'border-sky-700');
                    answerLocked = false;
                }, 800);
            }
        }

        // --- HINT TOGGLE & VOICE TRIGGER ---
        function toggleHint() {
            playSound('click');
            const drawer = document.getElementById('hint-drawer');
            if (drawer.classList.contains('hidden')) {
                drawer.classList.remove('hidden');
                speakHintText();
            } else {
                drawer.classList.add('hidden');
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        function hideHint() {
            const drawer = document.getElementById('hint-drawer');
            drawer.classList.add('hidden');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    </script>

    <!-- Multi-profile progress + Puter cloud sync -->
    <script type="module" src="/src/main.js"></script>
