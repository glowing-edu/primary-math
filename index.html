<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幼兒數學大冒險 - 5步學會加減法算理</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Puter.js (cloud progress sync) -->
    <script src="https://js.puter.com/v2/"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Fredoka & Noto Sans TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            touch-action: manipulation;
        }

        .ten-frame-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
        }

        .dot-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .bounce-btn {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .bounce-btn:active {
            transform: scale(0.95);
        }

        .math-tree-line {
            stroke: #94a3b8;
            stroke-width: 3;
            stroke-dasharray: 4;
        }

        /* Speech Bubble Pulse */
        .hint-pulse {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-6 text-slate-800">

    <!-- Header Navigation & Stage Selector -->
    <header class="relative z-40 max-w-4xl w-full mx-auto bg-white/90 backdrop-blur-md rounded-3xl p-4 shadow-lg border-4 border-sky-200 mb-4">
        <div class="flex flex-col gap-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-amber-400 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md transform -rotate-6">
                        <i class="fa-solid fa-shapes"></i>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-black text-sky-600 tracking-wide">幼兒數學大冒險</h1>
                        <p class="text-xs text-slate-500 font-bold">5歲專屬心算與算理啟蒙遊戲</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <!-- Puter cloud sync (injected by src/main.js) -->

                    <!-- Multi-profile switcher (injected by src/main.js) -->

    </header>

    <!-- Main Game Container -->
    <main class="max-w-4xl w-full mx-auto flex-1 bg-white rounded-3xl shadow-xl border-4 border-sky-100 p-4 md:p-8 flex flex-col justify-between relative overflow-hidden">

        <!-- Level Selection Screen -->
        <section id="level-screen" class="flex-1 min-h-0 overflow-y-auto flex flex-col justify-center">
            <div class="text-center mb-5">
                <h2 class="text-2xl md:text-3xl font-black text-sky-600">揀一個關卡</h2>
                <p class="text-sm text-slate-500 font-bold mt-1">Choose a level</p>
                <div class="inline-flex items-center gap-2 bg-amber-50 px-4 py-1.5 rounded-full border border-amber-200 mt-3">
                    <i class="fa-solid fa-star text-amber-400"></i>

        <!-- Question Display & Interactive Playground -->
        <div class="flex-1 flex flex-col items-center justify-center my-2">
            
            <!-- Dynamic Math Formula Header -->
            <div id="formula-container" class="flex items-center justify-center gap-3 text-3xl md:text-5xl font-black text-slate-700 mb-6 bg-slate-50 px-6 py-4 rounded-2xl border-2 border-slate-200 shadow-inner min-h-[90px] w-full max-w-md">
                <!-- Dynamic formula html -->
            </div>

            <!-- Visual 10-Frame / Visualization Canvas Container -->
            <div id="visual-area" class="w-full flex flex-col items-center justify-center my-2 min-h-[160px]">
                <!-- Dynamic 10-frame visual component -->
            </div>

            <!-- Visual Breakdown Hint Drawer (Hidden by default, toggled by 💡 button) -->
            <div id="hint-drawer" class="hidden w-full max-w-lg bg-amber-50 rounded-2xl border-2 border-amber-300 p-4 my-3 text-slate-700 shadow-md">
                <div class="flex items-center justify-between mb-2 border-b border-amber-200 pb-2">
                    <div class="flex items-center gap-2 text-amber-700 font-bold">
                        <i class="fa-solid fa-lightbulb text-amber-500 animate-bounce"></i>
                        <span>解題小秘訣（粵語講解）</span>
                    </div>
                    <button id="replay-speech-btn" onclick="speakHintText()" class="text-xs bg-amber-200 hover:bg-amber-300 text-amber-800 font-bold px-3 py-1 rounded-full flex items-center gap-1 transition">
                        <i class="fa-solid fa-volume-high"></i> 重播語音
                    </button>
                </div>
                <p class="text-[11px] font-bold text-amber-600 mb-2">用了提示，這題就不計分喔。</p>
                <!-- Dynamic Hint Diagram / Text -->
                <div id="hint-content" class="flex flex-col items-center justify-center text-sm md:text-base font-bold text-amber-900">
                    <!-- Injected visual hint breakdown -->
                </div>
            </div>

        </div>

        <!-- User Answer Input Options / Keypad -->
        <div class="w-full max-w-md mx-auto mt-4">
            <!-- Hint Button and Options wrapper -->
            <div class="flex items-center gap-3">
                <!-- Hint Button -->
                <button id="hint-btn" onclick="toggleHint()" class="hint-pulse bounce-btn bg-amber-400 hover:bg-amber-500 text-white font-black p-4 rounded-2xl shadow-lg border-b-4 border-amber-600 flex flex-col items-center justify-center gap-1 text-xs shrink-0">
                    <i class="fa-solid fa-lightbulb text-2xl"></i>
                    <span>提示</span>
                </button>

                <!-- Options / Multi-choice Grid or Number Keypad -->
                <div id="answer-options" class="grid grid-cols-4 gap-2 flex-1">
                    <!-- Dynamic Answer Buttons -->
                </div>
            </div>
        </div>

        </section>

    </main>

    <!-- Footer Feedback & Credits -->
    <footer class="max-w-4xl w-full mx-auto text-center mt-3 text-xs text-slate-500 font-medium">
        廣東話語音支援 · 依據5歲幼兒認知發展設計
    </footer>

    <!-- Audio Effects (Web Audio API Synthesizer) -->
    <script>
        // Web Audio API Context for sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }
    </script>

    <!-- Game Engine & Cantonese Speech Logic -->
    <script>
        // --- STAGE DEFINITIONS ---
        // Display order follows this array; `id` stays stable so saved progress
        // from earlier versions keeps pointing at the same skill.
        // New levels use ids 6-13 so old progress (ids 1-5) is untouched.
        const STAGES = [
            { id: 6, name: "數一數 1-5", desc: "實物點數與數量對應", group: "basics" },
            { id: 7, name: "5以內分與合", desc: "數的分解與組成", group: "basics" },
            { id: 8, name: "5以內加減法", desc: "情境加減概念", group: "basics" },
            { id: 9, name: "認數與點數", desc: "6-10 的數量對應", group: "basics" },
            { id: 10, name: "10以內分與合", desc: "10以內的分解與組成", group: "basics" },
            { id: 11, name: "10以內加法", desc: "10以內的加法概念", group: "basics" },
            { id: 12, name: "10以內減法", desc: "10以內的減法概念", group: "basics" },
            { id: 1, name: "10的組成與分解", desc: "湊十好朋友", group: "advanced" },
            { id: 13, name: "湊十法準備", desc: "三步拆數湊十（預備）", group: "advanced" },
            { id: 2, name: "合十法（湊十法）", desc: "加法進位心算", group: "advanced" },
            { id: 14, name: "破十法準備", desc: "三步拆數破十（預備）", group: "advanced" },
            { id: 3, name: "破十法", desc: "減法破十心算", group: "advanced" },
            { id: 15, name: "平十法準備", desc: "兩步拆數連減（預備）", group: "advanced" },
            { id: 4, name: "平十法", desc: "減法連續減到10", group: "advanced" },
            { id: 5, name: "借十法", desc: "直式退位減法筆算", group: "advanced" }
        ];

        let currentStage = 1;
        let currentQuestion = null;
        let score = 0;
        let currentHintSpeechText = "";
        let answerLocked = false;
        let questionMissed = false;
        let questionHintUsed = false;
        let savedProgress = null;

        // --- SAVED PROGRESS BRIDGE (multi-profile + Puter sync) ---
        function getGameScore() {
            return score;
        }
        window.getGameScore = getGameScore;

        // Restore a profile's progress into the running game.
        function applySavedProgress(saved) {
            const p = saved || {};
            savedProgress = p;
            score = Math.max(0, Number(p.score) || 0);
            currentStage = Math.min(STAGES.length, Math.max(1, Number(p.lastStage) || 1));
            answerLocked = false;
            const scoreEl = document.getElementById('score-count');
            if (scoreEl) scoreEl.innerText = score;
            updateStageHeader();
            showLevelSelect();
        }
        window.applySavedProgress = applySavedProgress;

        // Keep the level cards in sync while playing (main.js owns persistence).
        function updateLocalProgress(correct) {
            if (!savedProgress) return;
            const stageId = String(currentStage);
            const stages = savedProgress.stages || (savedProgress.stages = {});
            const stat = stages[stageId] || (stages[stageId] = { correct: 0, attempts: 0 });
            stat.attempts += 1;
            if (correct) stat.correct += 1;
            savedProgress.score = Math.max(Number(savedProgress.score) || 0, score);
            savedProgress.lastStage = currentStage;
            savedProgress.updatedAt = Date.now();
        }

        // --- WEB SPEECH API (CANTONESE) ---
        let cantoneseVoice = null;

        function initVoices() {
            if ('speechSynthesis' in window) {
                const updateVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    // Search specifically for Cantonese voice (zh-HK, Cantonese, or Hong Kong)
                    cantoneseVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue') || v.name.includes('Cantonese') || v.name.includes('Hong Kong')) ||
                                     voices.find(v => v.lang.startsWith('zh')) || null;
                };
                updateVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = updateVoices;
                }
            }
        }
        initVoices();

        function speakCantonese(text) {
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // stop previous speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.85; // slightly slower for 5yo child
            utterance.pitch = 1.1; // friendly warmer tone

            if (cantoneseVoice) {
                utterance.voice = cantoneseVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakHintText() {
            if (currentHintSpeechText) {
                speakCantonese(currentHintSpeechText);
            }
        }

        // --- GAME INIT & NAVIGATION ---
        window.onload = function() {
            if (window.PrimaryMathApp && typeof window.PrimaryMathApp.boot === 'function') {
                window.PrimaryMathApp.boot();
            } else {
                updateStageHeader();
                showLevelSelect();
            }
        };

        const LEVEL_STYLES = [
            { bg: 'bg-amber-400', ring: 'border-amber-200 hover:border-amber-400', icon: 'fa-hashtag' },
            { bg: 'bg-sky-500', ring: 'border-sky-200 hover:border-sky-400', icon: 'fa-sitemap' },
            { bg: 'bg-emerald-500', ring: 'border-emerald-200 hover:border-emerald-400', icon: 'fa-plus' },
            { bg: 'bg-violet-500', ring: 'border-violet-200 hover:border-violet-400', icon: 'fa-hashtag' },
            { bg: 'bg-sky-500', ring: 'border-sky-200 hover:border-sky-400', icon: 'fa-sitemap' },
            { bg: 'bg-emerald-500', ring: 'border-emerald-200 hover:border-emerald-400', icon: 'fa-plus' },
            { bg: 'bg-rose-500', ring: 'border-rose-200 hover:border-rose-400', icon: 'fa-minus' },
            { bg: 'bg-violet-500', ring: 'border-violet-200 hover:border-violet-400', icon: 'fa-shapes' },
            { bg: 'bg-cyan-500', ring: 'border-cyan-200 hover:border-cyan-400', icon: 'fa-sitemap' },
            { bg: 'bg-emerald-500', ring: 'border-emerald-200 hover:border-emerald-400', icon: 'fa-plus' },
            { bg: 'bg-rose-500', ring: 'border-rose-200 hover:border-rose-400', icon: 'fa-arrow-down' },
            { bg: 'bg-amber-500', ring: 'border-amber-200 hover:border-amber-400', icon: 'fa-minus' },
            { bg: 'bg-cyan-500', ring: 'border-cyan-200 hover:border-cyan-400', icon: 'fa-arrow-down' },
            { bg: 'bg-violet-500', ring: 'border-violet-200 hover:border-violet-400', icon: 'fa-arrow-right' },
            { bg: 'bg-rose-500', ring: 'border-rose-200 hover:border-rose-400', icon: 'fa-calculator' }
        ];

        const LEVEL_GROUPS = [
            { key: 'basics', title: '基礎 · 10以內', subtitle: '數量、分合與加減概念' },
            { key: 'advanced', title: '進階 · 20以內心算', subtitle: '湊十、破十、平十、借十' }
        ];

        function stageOrder(stageId) {
            return STAGES.findIndex((s) => s.id === stageId) + 1;
        }

        function renderLevelSelect() {
            const grid = document.getElementById('level-grid');
            if (!grid) return;

            const levelScore = document.getElementById('level-score-count');
            if (levelScore) levelScore.innerText = score;

            const hasPlayed = Boolean(savedProgress && (Number(savedProgress.attempts) > 0 || Number(savedProgress.updatedAt) > 0));

            grid.innerHTML = LEVEL_GROUPS.map((group) => {
                const cards = STAGES
                    .map((s, i) => ({ s, i }))
                    .filter(({ s }) => s.group === group.key)
                    .map(({ s, i }) => {
                        const style = LEVEL_STYLES[i % LEVEL_STYLES.length];
                        const stat = savedProgress && savedProgress.stages ? savedProgress.stages[String(s.id)] : null;
                        const correct = Math.max(0, Number(stat && stat.correct) || 0);
                        const attempts = Math.max(0, Number(stat && stat.attempts) || 0);
                        const progressText = attempts > 0
                            ? `答對 ${correct} / ${attempts} 題`
                            : '未開始 Not started';
                        const isCurrent = hasPlayed && s.id === currentStage;

                        return `
                            <button type="button" onclick="startStage(${s.id})"
                                class="bounce-btn text-left bg-white rounded-2xl border-2 ${style.ring} shadow-md p-4 flex items-start gap-3 hover:shadow-lg transition ${isCurrent ? 'ring-2 ring-offset-2 ring-sky-300' : ''}">
                                <span class="w-12 h-12 shrink-0 rounded-2xl ${style.bg} text-white flex items-center justify-center text-xl shadow-md">
                                    <i class="fa-solid ${style.icon}"></i>
                                </span>
                                <span class="flex-1 min-w-0">
                                    <span class="flex items-center gap-2">
                                        <span class="text-[11px] font-black text-slate-400">階段 ${i + 1}</span>
                                        ${isCurrent ? '<span class="text-[10px] font-black text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full">上次玩到</span>' : ''}
                                    </span>
                                    <span class="block font-black text-slate-700 mt-0.5">${s.name}</span>
                                    <span class="block text-xs text-slate-500 font-bold">${s.desc}</span>
                                    <span class="block text-[11px] font-bold mt-1.5 ${attempts > 0 ? 'text-emerald-600' : 'text-slate-400'}">${progressText}</span>
                                </span>
                                <span class="self-center text-slate-300 text-lg" aria-hidden="true">▶</span>
                            </button>
                        `;
                    })
                    .join('');

                if (!cards) return '';
                return `
                    <section>
                        <div class="flex flex-wrap items-baseline justify-between gap-1 mb-2">
                            <h3 class="font-black text-slate-700">${group.title}</h3>
                            <p class="text-[11px] font-bold text-slate-400">${group.subtitle}</p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4">${cards}</div>
                    </section>
                `;
            }).join('');
        }

        function updateStageHeader() {
            const badge = document.getElementById('stage-number-badge');
            const title = document.getElementById('stage-title');
            const stage = STAGES.find((s) => s.id === currentStage) || STAGES[0];
            if (badge) badge.innerText = `階段 ${stageOrder(stage.id)}`;
            if (title) title.innerText = stage.name;
        }

        function showLevelSelect() {
            const levels = document.getElementById('level-screen');
            const game = document.getElementById('game-screen');
            if (!levels || !game) return;
            levels.classList.remove('hidden');
            game.classList.add('hidden');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            renderLevelSelect();
        }

        function startStage(stageId) {
            const id = Math.min(STAGES.length, Math.max(1, Number(stageId) || 1));
            playSound('click');
            currentStage = id;
            hideHint();
            updateStageHeader();
            const levels = document.getElementById('level-screen');
            const game = document.getElementById('game-screen');
            if (levels) levels.classList.add('hidden');
            if (game) game.classList.remove('hidden');
            loadQuestion();
            if (window.GameProgress) {
                window.GameProgress.setStage(id);
            }
        }

        // --- QUESTION GENERATORS FOR EACH STAGE ---
        function loadQuestion() {
            answerLocked = false;
            questionMissed = false;
            questionHintUsed = false;
            setPointNote(false);
            hideHint();
            const formulaBox = document.getElementById('formula-container');
            const visualArea = document.getElementById('visual-area');
            const optionsBox = document.getElementById('answer-options');

            switch(currentStage) {
                case 1:
                    generateStage1(formulaBox, visualArea, optionsBox);
                    break;
                case 2:
                    generateStage2(formulaBox, visualArea, optionsBox);
                    break;
                case 3:
                    generateStage3(formulaBox, visualArea, optionsBox);
                    break;
                case 4:
                    generateStage4(formulaBox, visualArea, optionsBox);
                    break;
                case 5:
                    generateStage5(formulaBox, visualArea, optionsBox);
                    break;
                case 6:
                    generateStage6(formulaBox, visualArea, optionsBox);
                    break;
                case 7:
                    generateStage7(formulaBox, visualArea, optionsBox);
                    break;
                case 8:
                    generateStage8(formulaBox, visualArea, optionsBox);
                    break;
                case 9:
                    generateStage9(formulaBox, visualArea, optionsBox);
                    break;
                case 10:
                    generateStage10(formulaBox, visualArea, optionsBox);
                    break;
                case 11:
                    generateStage11(formulaBox, visualArea, optionsBox);
                    break;
                case 12:
                    generateStage12(formulaBox, visualArea, optionsBox);
                    break;
                case 13:

        // --- STAGE 1: 10的組成與分解 ---
        function generateStage1(formulaBox, visualArea, optionsBox) {

        // --- STAGE 2: 合十法 (湊十法) ---
        function generateStage2(formulaBox, visualArea, optionsBox) {
            const num1 = Math.floor(Math.random() * 3) + 7; // 7, 8, 9 (Big number)

        // --- STAGE 3: 破十法 ---

        // --- STAGE 4: 平十法 ---
        function generateStage4(formulaBox, visualArea, optionsBox) {

            currentHintSpeechText = `平十法策略：我們將減數 ${subtrahend} 拆開為 ${sub1} 同 ${sub2}。第一步：用 ${minuend} 減去 ${sub1}，正好平降到整十 10！第二步：再用 10 減去剩下的 ${sub2}，答案就是 ${ans}！`;

        // --- STAGE 5: 借十法 (直式退位筆算) ---
        function generateStage5(formulaBox, visualArea, optionsBox) {
            const tens = Math.floor(Math.random() * 3) + 2; // 2, 3, 4

        // --- BEGINNER STAGES (ids 6-9): NUMBERS UP TO 10 ---

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function pickRandom(items) {
            return items[Math.floor(Math.random() * items.length)];

        const COUNT_THEMES = [

        // Counting (點數) with a changing arrangement so children see that the
        // total stays the same however the objects are laid out.
        function buildCountingQuestion(n, minVal, maxVal, formulaBox, visualArea, optionsBox) {

        // Part-part-whole (分與合) on a 5/10 frame.
        function buildBondQuestion(total, maxTotal, formulaBox, visualArea, optionsBox) {

            currentHintSpeechText = `${total} 可以分成 ${part} 同 ${other}。我哋試下：${part} 個藍色加埋 ${other} 個黃色，合起來就係 ${total} 個。`;
            document.getElementById('hint-content').innerHTML = `
                <div class="text-center space-y-2">
                    <p class="text-sm">${total} 可以分成：</p>
                    <div class="flex justify-center items-center gap-3 text-lg font-black">
                        <span class="bg-sky-100 text-sky-700 px-3 py-1 rounded-xl">${part}</span>
                        <span>同</span>
                        <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-xl animate-pulse">${other}</span>
                    </div>
                    <p class="text-xs text-slate-600">合起來：${part} + ${other} = <strong>${total}</strong></p>
                </div>
            `;

            renderMultipleChoiceOptions(other, 1, maxTotal, optionsBox);
        }

        // Contextual addition (合起來 / 加上去).
        function buildAdditionQuestion(a, b, limit, formulaBox, visualArea, optionsBox) {
            const ans = a + b;
            const ctx = pickRandom(ADD_CONTEXTS);
            currentQuestion = { ans, kind: 'add', a, b };

            formulaBox.innerHTML = `
                <span>${a}</span>
                <span class="text-emerald-500">+</span>
                <span>${b}</span>
                <span class="text-slate-400">=</span>
                <span class="inline-block border-b-4 border-dashed border-emerald-400 w-14 text-center text-emerald-600">?</span>
            `;

            const group = (count) => `
                <div class="flex flex-wrap items-center justify-center gap-2 max-w-[9rem]">
                    ${Array.from({ length: count }, () => `<span class="text-3xl md:text-4xl leading-none dot-pop">${ctx.emoji}</span>`).join('')}
                </div>
            `;

            visualArea.innerHTML = `
                <div class="flex flex-col items-center gap-3">
                    <p class="text-xs font-bold text-slate-500 text-center max-w-md">${ctx.text(a, b)}</p>
                    <div class="flex items-center justify-center gap-4">
                        ${group(a)}
                        <span class="text-2xl font-black text-emerald-500">+</span>
                        ${group(b)}
                    </div>
                </div>
            `;

            const countOn = Array.from({ length: b }, (_, i) => a + i + 1).join('、');
            currentHintSpeechText = `呢度有 ${a} 個，再加多 ${b} 個。我哋由 ${a} 開始數多 ${b} 個：${countOn}，一共係 ${ans} 個。`;
            document.getElementById('hint-content').innerHTML = `
                <div class="text-center space-y-2">
                    <p class="text-sm">兩堆合起來：</p>
                    <div class="flex justify-center items-center gap-3 text-lg font-black">
                        <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-xl">${a}</span>
                        <span>+</span>
                        <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-xl">${b}</span>
                        <span>=</span>
                        <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-xl animate-pulse">${ans}</span>
                    </div>
                    <p class="text-xs text-slate-600">一齊由 1 數到 ${ans}，就知一共有 ${ans} 個。</p>
                </div>
            `;

            renderMultipleChoiceOptions(ans, 1, limit, optionsBox);
        }

        // Contextual subtraction (拿走 / 剩下).
        function buildSubtractionQuestion(total, removed, limit, formulaBox, visualArea, optionsBox) {
            const ans = total - removed;
            const ctx = pickRandom(SUB_CONTEXTS);
            currentQuestion = { ans, kind: 'sub', total, removed };

            formulaBox.innerHTML = `
                <span>${total}</span>
                <span class="text-rose-500">-</span>
                <span>${removed}</span>
                <span class="text-slate-400">=</span>
                <span class="inline-block border-b-4 border-dashed border-rose-400 w-14 text-center text-rose-600">?</span>
            `;

            const items = Array.from({ length: total }, (_, i) => {
                if (i < removed) {
                    return `<span class="relative text-3xl md:text-4xl leading-none opacity-30 grayscale">${ctx.emoji}<span class="absolute inset-0 flex items-center justify-center text-rose-500 text-2xl font-black">✕</span></span>`;
                }
                return `<span class="text-3xl md:text-4xl leading-none dot-pop">${ctx.emoji}</span>`;
            }).join('');

            visualArea.innerHTML = `
                <div class="flex flex-col items-center gap-3">
                    <p class="text-xs font-bold text-slate-500 text-center max-w-md">${ctx.text(total, removed)}</p>
                    <div class="flex flex-wrap items-center justify-center gap-2 max-w-lg">${items}</div>
                </div>
            `;

            currentHintSpeechText = `原本有 ${total} 個，拿走 ${removed} 個，剩返 ${ans} 個。我哋由 ${total} 開始倒數 ${removed} 個，最後剩返 ${ans} 個。`;
            document.getElementById('hint-content').innerHTML = `
                <div class="text-center space-y-2">
                    <p class="text-sm">由 ${total} 拿走 ${removed}：</p>
                    <div class="flex justify-center items-center gap-3 text-lg font-black">
                        <span class="bg-rose-100 text-rose-700 px-3 py-1 rounded-xl">${total}</span>
                        <span>-</span>
                        <span class="bg-rose-100 text-rose-700 px-3 py-1 rounded-xl">${removed}</span>
                        <span>=</span>
                        <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-xl animate-pulse">${ans}</span>
                    </div>
                    <p class="text-xs text-slate-600">打咗交叉嘅就係拿走咗嘅 ${removed} 個。</p>
                </div>
            `;

            renderMultipleChoiceOptions(ans, 0, limit, optionsBox);
        }

        // Stage 6: count real objects 1-5.
        function generateStage6(formulaBox, visualArea, optionsBox) {
            buildCountingQuestion(randomInt(1, 5), 1, 5, formulaBox, visualArea, optionsBox);
        }

        // Stage 7: number bonds within 5.
        function generateStage7(formulaBox, visualArea, optionsBox) {
            buildBondQuestion(randomInt(2, 5), 5, formulaBox, visualArea, optionsBox);
        }

        // Stage 8: addition/subtraction within 5, with story contexts.
        function generateStage8(formulaBox, visualArea, optionsBox) {
            if (Math.random() < 0.5) {
                const a = randomInt(1, 4);
                const b = randomInt(1, 5 - a);
                buildAdditionQuestion(a, b, 5, formulaBox, visualArea, optionsBox);
            } else {
                const total = randomInt(2, 5);
                const removed = randomInt(1, total - 1);
                buildSubtractionQuestion(total, removed, 5, formulaBox, visualArea, optionsBox);
            }
        }

        // Stage 9: recognise and count quantities 6-10.
        function generateStage9(formulaBox, visualArea, optionsBox) {
            buildCountingQuestion(randomInt(6, 10), 6, 10, formulaBox, visualArea, optionsBox);
        }

        // Stage 10: number bonds within 10 (includes the key bond of 10).
        function generateStage10(formulaBox, visualArea, optionsBox) {
            buildBondQuestion(randomInt(6, 10), 10, formulaBox, visualArea, optionsBox);
        }

        // Stage 11: addition with sums from 6 to 10.
        function generateStage11(formulaBox, visualArea, optionsBox) {
            const ans = randomInt(6, 10);
            const a = randomInt(1, ans - 1);
            const b = ans - a;
            buildAdditionQuestion(a, b, 10, formulaBox, visualArea, optionsBox);
        }

        // Stage 12: subtraction from totals 6 to 10.
        function generateStage12(formulaBox, visualArea, optionsBox) {
            const total = randomInt(6, 10);
            const removed = randomInt(1, total - 1);
            buildSubtractionQuestion(total, removed, 10, formulaBox, visualArea, optionsBox);
        }

        // Stage 13: guided make-ten preparation.
        // One question has three picks, e.g. 8 + 5:
        //   1) 8 needs 2 to make 10
        //   2) 5 splits into 2 and 3
        //   3) 8 + 2 + 3 = 13
        function generateStage13(formulaBox, visualArea, optionsBox) {
            const num1 = randomInt(6, 9); // larger addend
            const splitNeeded = 10 - num1;
            const minNum2 = Math.max(4, splitNeeded + 1);
            const num2 = randomInt(minNum2, num1 - 1); // keep num1 as the larger number
            const remain = num2 - splitNeeded;

            currentQuestion = {
                kind: 'makeTenPrep',
                step: 1,
                num1,
                num2,
                splitNeeded,
                remain,
                total: num1 + num2,
                ans: splitNeeded
            };

            renderMakeTenPrepStep(1);
        }

        function renderMakeTenPrepStep(step) {
            const q = currentQuestion;
            if (!q || q.kind !== 'makeTenPrep') return;

            const optionsBox = document.getElementById('answer-options');
            if (!optionsBox) return;

            q.step = step;
            answerLocked = false;
            hideHint();

            let prompt = '';

            if (step === 1) {
                q.ans = q.splitNeeded;
                renderMakeTenDiagram(q, step, `先睇大數 <strong class="text-sky-600">${q.num1}</strong>，仲差幾多就湊成 <strong class="text-amber-600">10</strong>？`);

                currentHintSpeechText = `大數 ${q.num1} 同 ${q.splitNeeded} 湊成 10。所以第一步要揀 ${q.splitNeeded}。`;
                document.getElementById('hint-content').innerHTML = `
                    <div class="text-center space-y-2">
                        <p class="text-sm">大數 ${q.num1} 同幾多湊成 10？</p>
                        <div class="flex justify-center items-center gap-3 text-lg font-black">
                            <span class="text-sky-600">${q.num1}</span>
                            <span>+</span>
                            <span class="bg-amber-200 text-amber-900 px-3 py-1 rounded-xl animate-pulse">${q.splitNeeded}</span>
                            <span>= 10</span>
                        </div>
                    </div>
                `;

                prompt = `我哋用湊十法。先睇大數 ${q.num1}。${q.num1} 同幾多湊成 10 呀？揀返個數字。`;
                renderMultipleChoiceOptions(q.splitNeeded, 1, 9, optionsBox);
            } else if (step === 2) {
                q.ans = q.remain;
                renderMakeTenDiagram(q, step, `細數 <strong class="text-emerald-600">${q.num2}</strong> 可以分成 <strong class="text-amber-600">${q.splitNeeded}</strong> 同幾多？`);

                currentHintSpeechText = `細數 ${q.num2} 分成 ${q.splitNeeded} 同 ${q.remain}，因為 ${q.splitNeeded} 加 ${q.remain} 等於 ${q.num2}。`;
                document.getElementById('hint-content').innerHTML = `
                    <div class="text-center space-y-2">
                        <p class="text-sm">細數 ${q.num2} 可以分成：</p>
                        <div class="flex justify-center items-center gap-3 text-lg font-black">
                            <span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-xl">${q.splitNeeded}</span>
                            <span>同</span>
                            <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-xl animate-pulse">${q.remain}</span>
                        </div>
                        <p class="text-xs text-slate-600">合起來：${q.splitNeeded} + ${q.remain} = <strong>${q.num2}</strong></p>
                    </div>
                `;

                prompt = `好叻！而家睇細數 ${q.num2}。${q.num2} 可以分成 ${q.splitNeeded} 同幾多呀？`;
                renderMultipleChoiceOptions(q.remain, 1, q.num2 - 1, optionsBox);
            } else {
                q.ans = q.total;
                renderMakeTenDiagram(q, step, `最後答案：<strong class="text-sky-600">${q.num1}</strong> + <strong class="text-amber-600">${q.splitNeeded}</strong> + <strong class="text-emerald-600">${q.remain}</strong> = 幾多？`);

                currentHintSpeechText = `${q.num1} 加 ${q.splitNeeded} 等於 10，10 再加 ${q.remain} 等於 ${q.total}。所以 ${q.num1} 加 ${q.num2} 等於 ${q.total}。`;
                document.getElementById('hint-content').innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <p class="text-sm">兩步合起來：</p>
                        <p class="text-base font-black text-sky-700">${q.num1} + ${q.splitNeeded} = 10</p>
                        <p class="text-base font-black text-amber-700">10 + ${q.remain} = <span class="text-emerald-700">${q.total}</span></p>
                        <p class="text-sm font-black text-slate-700">${q.num1} + ${q.num2} = ${q.total}</p>
                    </div>
                `;

                prompt = `最後一步。${q.num1} 加 ${q.splitNeeded} 等於 10，10 再加 ${q.remain}。咁 ${q.num1} 加 ${q.num2} 等於幾多呀？`;
                renderMultipleChoiceOptions(q.total, 10, 20, optionsBox);
            }

            requestAnimationFrame(() => layoutMakeTenDiagram());

            // Speak the instruction for this step after the new options render.
            setTimeout(() => {
                const game = document.getElementById('game-screen');
                if (currentQuestion === q && currentQuestion.step === step && game && !game.classList.contains('hidden')) {
                    speakCantonese(prompt);
                }
            }, 350);
        }

        // One fixed diagram is reused for all three picks:
        //   full formula, with the smaller addend split into two leaves below it.
        // The first bracket groups the big addend with the first split part to
        // show 10. The last step adds a second bracket linking that 10 to the
        // remaining part. Space for both brackets is reserved in every step.
        function renderMakeTenDiagram(q, step, instruction) {
            const formulaBox = document.getElementById('formula-container');
            const visualArea = document.getElementById('visual-area');
            if (!formulaBox || !visualArea) return;

            formulaBox.innerHTML = `
                <span>${q.num1}</span>
                <span class="text-emerald-500">+</span>
                <span>${q.num2}</span>
                <span class="text-slate-400">=</span>
                <span class="inline-block border-b-4 border-dashed border-emerald-400 w-16 text-center text-emerald-600">?</span>
            `;

            const stepBadge = `
                <div class="flex items-center gap-1.5" aria-label="第 ${step} 步，共 3 步">
                    ${[1, 2, 3].map((n) => `
                        <span class="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black ${
                            n === step ? 'bg-sky-500 text-white' : n < step ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'
                        }">${n < step ? '✓' : n}</span>
                    `).join('')}
                </div>
            `;

            const leftLeaf = step >= 2
                ? `<span data-mt="leaf1" class="border-2 border-transparent bg-amber-200 text-amber-900 ring-2 ring-amber-300 font-black text-xl px-4 py-1.5 rounded-xl shadow">${q.splitNeeded}</span>`
                : `<span data-mt="leaf1" class="bg-white border-2 border-dashed border-amber-400 text-amber-500 font-black text-xl px-4 py-1.5 rounded-xl animate-pulse">?</span>`;
            const rightLeaf = step >= 3
                ? `<span data-mt="leaf2" class="border-2 border-transparent bg-emerald-200 text-emerald-900 ring-2 ring-emerald-300 font-black text-xl px-4 py-1.5 rounded-xl shadow">${q.remain}</span>`
                : `<span data-mt="leaf2" class="bg-white border-2 border-dashed border-emerald-300 text-emerald-400 font-black text-xl px-4 py-1.5 rounded-xl ${step === 2 ? 'animate-pulse' : ''}">?</span>`;

            // The final pick adds a second bracket: 10 + 1 = ?
            const secondStep = step === 3
                ? `<span id="mt-plus" class="absolute z-10 text-emerald-600 font-black text-2xl leading-none" aria-hidden="true">+</span>
                   <span data-mt="total" class="absolute z-10 bg-white border-2 border-dashed border-emerald-300 text-emerald-400 font-black text-xl px-4 py-1.5 rounded-xl animate-pulse">?</span>`
                : '';

            visualArea.innerHTML = `
                <div class="flex flex-col items-center gap-3 w-full">
                    ${stepBadge}
                    <p class="text-xs md:text-sm font-bold text-slate-500 text-center">${instruction}</p>
                    <div id="mt-diagram" data-step="${step}" class="relative flex flex-col items-center px-8 pt-1">
                        <div id="mt-eq" class="flex items-center gap-2 md:gap-3 text-3xl md:text-4xl font-black">
                            <span data-mt="num1" class="text-sky-600 bg-sky-50 ring-2 ring-sky-200 px-1.5 rounded-xl">${q.num1}</span>
                            <span class="text-emerald-500">+</span>
                            <span data-mt="num2" class="text-slate-700 px-1.5 rounded-xl">${q.num2}</span>
                            <span class="text-slate-400">=</span>
                            <span class="text-slate-400 px-1.5">?</span>
                        </div>
                        <div id="mt-bond" class="relative mt-5 flex flex-col items-center">
                            <div class="flex items-start gap-5 sm:gap-6">${leftLeaf}${rightLeaf}</div>
                        </div>
                        <!-- Keep the bracket area reserved in every step so the
                             layout does not jump when the final bracket appears. -->
                        <div class="h-40" aria-hidden="true"></div>
                        ${secondStep}
                        <svg id="mt-lines" class="pointer-events-none absolute inset-0 overflow-visible" aria-hidden="true"></svg>
                    </div>
                </div>
            `;
        }

        function layoutMakeTenDiagram() {
            const diagram = document.getElementById('mt-diagram');
            if (!diagram) return;
            const eq = document.getElementById('mt-eq');
            const num1 = diagram.querySelector('[data-mt="num1"]');
            const num2 = diagram.querySelector('[data-mt="num2"]');
            const leaf1 = diagram.querySelector('[data-mt="leaf1"]');
            const leaf2 = diagram.querySelector('[data-mt="leaf2"]');
            const bond = document.getElementById('mt-bond');
            const plus = document.getElementById('mt-plus');
            const total = diagram.querySelector('[data-mt="total"]');
            const step = Number(diagram.dataset.step || 0);
            const svg = document.getElementById('mt-lines');
            if (!eq || !num1 || !num2 || !leaf1 || !leaf2 || !bond || !svg) return;

            // Place the two leaves directly under the smaller addend.
            bond.style.transform = 'none';
            const dr = diagram.getBoundingClientRect();
            const nr = num2.getBoundingClientRect();
            const dx = (nr.left + nr.width / 2) - (dr.left + dr.width / 2);
            bond.style.transform = `translateX(${dx}px)`;

            // Measure after the shift so the connector lines match the leaves.
            const dr2 = diagram.getBoundingClientRect();
            const n1r = num1.getBoundingClientRect();
            const n2r = num2.getBoundingClientRect();
            const l1r = leaf1.getBoundingClientRect();
            const l2r = leaf2.getBoundingClientRect();
            const w = Math.ceil(dr2.width);
            const h = Math.ceil(dr2.height);
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
            svg.setAttribute('width', String(w));
            svg.setAttribute('height', String(h));

            const rel = (r) => ({
                top: r.top - dr2.top,
                bottom: r.bottom - dr2.top,
                cx: r.left - dr2.left + r.width / 2,
            });
            const n1 = rel(n1r);
            const l1 = rel(l1r);
            const l2 = rel(l2r);
            // Straight /\ lines from the small number down to its two parts.
            const root = {
                x: n2r.left - dr2.left + n2r.width / 2,
                y: n2r.bottom - dr2.top + 2,
            };

            // 5 splits into the two leaves.
            const bondLine = (leaf) => `<path d="M ${root.x} ${root.y} L ${leaf.cx} ${leaf.top}" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" />`;
            // A |_| bracket under the big number and the first picked part
            // shows that those two are grouped to make ten.
            const leftX = n1.cx;
            const rightX = l1.cx;
            const bracketY = Math.max(n1.bottom, l1.bottom) + 14;
            const groupLine = `<path d="M ${leftX} ${n1.bottom + 4} L ${leftX} ${bracketY} L ${rightX} ${bracketY} L ${rightX} ${l1.bottom + 4}" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;
            const bracketLabel = `<text x="${(leftX + rightX) / 2}" y="${bracketY + 16}" text-anchor="middle" font-size="16" font-weight="800" fill="#b45309" font-family="ui-sans-serif, system-ui, sans-serif">10</text>`;

            svg.innerHTML = bondLine(l1) + bondLine(l2) + groupLine + bracketLabel;

            // In the last step the "10" label and the remaining leaf are joined
            // by a second bracket: 10 + 1 = ?. The plus sits above the bar and
            // the answer box sits below it.
            if (step === 3 && plus && total) {
                const textEl = svg.querySelector('text');
                if (textEl) {
                    const ten = rel(textEl.getBoundingClientRect());
                    const bar2Y = Math.max(ten.bottom, l2.bottom) + 14;
                    const left2X = ten.cx;
                    const right2X = l2.cx;
                    const secondBracket = `<path d="M ${left2X} ${ten.bottom + 2} L ${left2X} ${bar2Y} L ${right2X} ${bar2Y} L ${right2X} ${l2.bottom + 4}" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;
                    svg.innerHTML += secondBracket;

                    const mid2X = (left2X + right2X) / 2;
                    plus.style.left = `${mid2X}px`;
                    plus.style.top = `${bar2Y - 8}px`;
                    plus.style.transform = 'translate(-50%, -100%)';

                    total.style.left = `${mid2X}px`;
                    total.style.top = `${bar2Y + 10}px`;
                    total.style.transform = 'translateX(-50%)';
                }
            }
        }

        // Keep the bond/bracket aligned when the layout reflows.
        window.addEventListener('resize', () => {
            if (document.getElementById('mt-diagram')) layoutMakeTenDiagram();
            if (document.getElementById('bt-diagram')) layoutBreakTenDiagram();
            if (document.getElementById('pt-diagram')) layoutPingTenDiagram();
        });

        // Stage 14: guided break-ten preparation.
        // One question has three picks, e.g. 13 - 8:
        //   1) 13 = 10 + ?   -> 3
        //   2) 10 - 8 = ?    -> 2
        //   3) 3 + 2 = ?     -> 5
        function generateStage14(formulaBox, visualArea, optionsBox) {
            const ones = randomInt(1, 4);
            const minuend = 10 + ones;
            const subtrahend = randomInt(8, 9);
            const tenMinusSub = 10 - subtrahend;

            currentQuestion = {
                kind: 'breakTenPrep',
                step: 1,
                minuend,
                subtrahend,
                ones,
                tenMinusSub,
                total: minuend - subtrahend,
                ans: ones
            };

            renderBreakTenPrepStep(1);
        }

        function renderBreakTenPrepStep(step) {
            const q = currentQuestion;
            if (!q || q.kind !== 'breakTenPrep') return;

            const optionsBox = document.getElementById('answer-options');
            if (!optionsBox) return;

            q.step = step;
            answerLocked = false;
            hideHint();

            let prompt = '';

            if (step === 1) {
                q.ans = q.ones;
                renderBreakTenDiagram(q, step, `${q.minuend} 可以分成幾多同 <strong class="text-purple-700">10</strong>？<span class="text-slate-400">(? + 10 = ${q.minuend})</span>`);

                currentHintSpeechText = `因為 10 加 ${q.ones} 等於 ${q.minuend}，所以 ${q.minuend} 可以分成 10 同 ${q.ones}。`;
                document.getElementById('hint-content').innerHTML = `
                    <div class="text-center space-y-2">
                        <p class="text-sm">幾多加 10 等於 ${q.minuend}？</p>
                        <div class="flex justify-center items-center gap-3 text-lg font-black">
                            <span class="bg-amber-200 text-amber-900 px-3 py-1 rounded-xl animate-pulse">${q.ones}</span>
                            <span>+</span>
                            <span class="text-purple-700">10</span>
                            <span>=</span>
                            <span>${q.minuend}</span>
                        </div>
                    </div>
                `;

                prompt = `我哋用破十法。${q.minuend} 可以分成幾多同 10 呀？即係幾多加 10 等於 ${q.minuend}？`;
                renderMultipleChoiceOptions(q.ones, 1, 9, optionsBox);
            } else if (step === 2) {
                q.ans = q.tenMinusSub;

                const cells = Array.from({ length: 10 }, (_, i) => {
                    if (i < q.subtrahend) {
                        return `<div class="rounded-full bg-slate-300 line-through opacity-50 text-white text-[10px] flex items-center justify-center"><i class="fa-solid fa-circle"></i></div>`;
                    }
                    return `<div class="rounded-full bg-purple-500 text-white text-[10px] flex items-center justify-center"><i class="fa-solid fa-circle"></i></div>`;
                }).join('');

                renderBreakTenDiagram(q, step, `<strong class="text-purple-700">10</strong> - <strong class="text-rose-600">${q.subtrahend}</strong> = 幾多？`);

                currentHintSpeechText = `10 減 ${q.subtrahend} 等於 ${q.tenMinusSub}。`;
                document.getElementById('hint-content').innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <p class="text-sm">10 個裡面拿走 ${q.subtrahend} 個</p>
                        <div class="ten-frame-grid w-40 h-20 bg-purple-50 border-2 border-purple-300 rounded-xl p-1.5 shadow">${cells}</div>
                        <p class="text-base font-black text-purple-700">10 - ${q.subtrahend} = ${q.tenMinusSub}</p>
                    </div>
                `;

                prompt = `而家用 10 減 ${q.subtrahend}，等於幾多呀？`;
                renderMultipleChoiceOptions(q.tenMinusSub, 1, 9, optionsBox);
            } else {
                q.ans = q.total;
                renderBreakTenDiagram(q, step, `最後答案：<strong class="text-amber-600">${q.ones}</strong> + <strong class="text-emerald-600">${q.tenMinusSub}</strong> = 幾多？`);

                currentHintSpeechText = `10 減 ${q.subtrahend} 剩 ${q.tenMinusSub}，再加個位 ${q.ones}，等於 ${q.total}。所以 ${q.minuend} 減 ${q.subtrahend} 等於 ${q.total}。`;
                document.getElementById('hint-content').innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <p class="text-sm">兩步合起來：</p>
                        <p class="text-base font-black text-purple-700">10 - ${q.subtrahend} = ${q.tenMinusSub}</p>
                        <p class="text-base font-black text-amber-700">${q.ones} + ${q.tenMinusSub} = <span class="text-emerald-700">${q.total}</span></p>
                        <p class="text-sm font-black text-slate-700">${q.minuend} - ${q.subtrahend} = ${q.total}</p>
                    </div>
                `;

                prompt = `最後一步。${q.ones} 加 ${q.tenMinusSub} 等於幾多呀？`;
                renderMultipleChoiceOptions(q.total, 1, 9, optionsBox);
            }

            requestAnimationFrame(() => layoutBreakTenDiagram());

            setTimeout(() => {
                const game = document.getElementById('game-screen');
                if (currentQuestion === q && currentQuestion.step === step && game && !game.classList.contains('hidden')) {
                    speakCantonese(prompt);
                }
            }, 350);
        }

        // Same idea as the make-ten diagram: keep one view and fill it in.
        // 13 splits into 10 and the ones digit, then 10 splits into the
        // subtrahend and the amount left over.
        function renderBreakTenDiagram(q, step, instruction) {
            const formulaBox = document.getElementById('formula-container');
            const visualArea = document.getElementById('visual-area');
            if (!formulaBox || !visualArea) return;

            formulaBox.innerHTML = `
                <span class="text-rose-600">${q.minuend}</span>
                <span class="text-rose-500">-</span>
                <span>${q.subtrahend}</span>
                <span class="text-slate-400">=</span>
                <span class="inline-block border-b-4 border-dashed border-rose-400 w-16 text-center text-rose-600">?</span>
            `;

            const stepBadge = `
                <div class="flex items-center gap-1.5" aria-label="第 ${step} 步，共 3 步">
                    ${[1, 2, 3].map((n) => `
                        <span class="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black ${
                            n === step ? 'bg-rose-500 text-white' : n < step ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'
                        }">${n < step ? '✓' : n}</span>
                    `).join('')}
                </div>
            `;

            const tenLeaf = `<span data-bt="ten" class="bg-purple-200 text-purple-900 ring-2 ring-purple-300 font-black text-xl px-3 py-1.5 rounded-xl shadow">10</span>`;
            const onesLeaf = step >= 2
                ? `<span data-bt="ones" class="bg-amber-200 text-amber-900 ring-2 ring-amber-300 font-black text-xl px-4 py-1.5 rounded-xl shadow">${q.ones}</span>`
                : `<span data-bt="ones" class="bg-white border-2 border-dashed border-amber-400 text-amber-500 font-black text-xl px-4 py-1.5 rounded-xl animate-pulse">?</span>`;
            // 10 − 9 reuses the "10" leaf and the 9 from the original equation,
            // so only the picked answer needs its own box.
            const resultLeaf = step >= 3
                ? `<span data-bt="result" class="absolute z-10 bg-emerald-200 text-emerald-900 ring-2 ring-emerald-300 font-black text-xl px-4 py-1.5 rounded-xl shadow">${q.tenMinusSub}</span>`
                : `<span data-bt="result" class="absolute z-10 bg-white border-2 border-dashed border-emerald-300 text-emerald-400 font-black text-xl px-4 py-1.5 rounded-xl ${step === 2 ? 'animate-pulse' : ''}">?</span>`;
            // The final answer is the sum of the ones digit and the result of
            // 10 − subtrahend, so those two are joined by a bracket too.
            const totalLeaf = `<span data-bt="total" class="absolute z-10 bg-white border-2 border-dashed border-emerald-300 text-emerald-400 font-black text-xl px-4 py-1.5 rounded-xl ${step === 3 ? 'animate-pulse' : ''}">?</span>`;

            visualArea.innerHTML = `
                <div class="flex flex-col items-center gap-3 w-full">
                    ${stepBadge}
                    <p class="text-xs md:text-sm font-bold text-slate-500 text-center">${instruction}</p>
                    <div id="bt-diagram" data-step="${step}" class="relative flex flex-col items-center px-6 pt-1">
                        <div id="bt-eq" class="flex items-center gap-2 md:gap-3 text-3xl md:text-4xl font-black">
                            <span data-bt="minuend" class="text-rose-600 bg-rose-50 ring-2 ring-rose-200 px-1.5 rounded-xl">${q.minuend}</span>
                            <span class="text-rose-500">-</span>
                            <span data-bt="subtrahend" class="text-slate-700 px-1.5 rounded-xl">${q.subtrahend}</span>
                            <span class="text-slate-400">=</span>
                            <span class="text-slate-400 px-1.5">?</span>
                        </div>
                        <div id="bt-bond" class="relative mt-5 flex flex-col items-center">
                            <div class="flex items-start gap-5 sm:gap-6">${onesLeaf}${tenLeaf}</div>
                        </div>
                        <div class="h-44" aria-hidden="true"></div>
                        <span id="bt-minus" class="absolute z-10 text-rose-500 font-black text-2xl leading-none" aria-hidden="true">−</span>
                        ${resultLeaf}
                        <span id="bt-plus" class="absolute z-10 text-emerald-600 font-black text-2xl leading-none" aria-hidden="true">+</span>
                        ${totalLeaf}
                        <svg id="bt-lines" class="pointer-events-none absolute inset-0 overflow-visible" aria-hidden="true"></svg>
                    </div>
                </div>
            `;
        }

        function layoutBreakTenDiagram() {
            const diagram = document.getElementById('bt-diagram');
            if (!diagram) return;
            const minuend = diagram.querySelector('[data-bt="minuend"]');
            const subtrahend = diagram.querySelector('[data-bt="subtrahend"]');
            const topBond = document.getElementById('bt-bond');
            const ten = diagram.querySelector('[data-bt="ten"]');
            const ones = diagram.querySelector('[data-bt="ones"]');
            const result = diagram.querySelector('[data-bt="result"]');
            const total = diagram.querySelector('[data-bt="total"]');
            const minus = document.getElementById('bt-minus');
            const plus = document.getElementById('bt-plus');
            const svg = document.getElementById('bt-lines');
            if (!minuend || !subtrahend || !topBond || !ten || !ones || !result || !total || !minus || !plus || !svg) return;

            // Top bond sits under the minuend.
            topBond.style.transform = 'none';
            const dr = diagram.getBoundingClientRect();
            const mr = minuend.getBoundingClientRect();
            const dxTop = (mr.left + mr.width / 2) - (dr.left + dr.width / 2);
            topBond.style.transform = `translateX(${dxTop}px)`;

            // Measure after the shift so the lines match the leaves.
            const dr3 = diagram.getBoundingClientRect();
            const mr2 = minuend.getBoundingClientRect();
            const sr = subtrahend.getBoundingClientRect();
            const tr2 = ten.getBoundingClientRect();
            const or = ones.getBoundingClientRect();
            const w = Math.ceil(dr3.width);
            const h = Math.ceil(dr3.height);
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
            svg.setAttribute('width', String(w));
            svg.setAttribute('height', String(h));

            const rel = (r) => ({
                top: r.top - dr3.top,
                bottom: r.bottom - dr3.top,
                cx: r.left - dr3.left + r.width / 2,
            });
            const m = rel(mr2);
            const s = rel(sr);
            const t = rel(tr2);
            const o = rel(or);
            const line = (x1, y1, x2, y2, color) => `<path d="M ${x1} ${y1} L ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" />`;

            // A |_| bracket joins the "10" leaf with the 9 from the original
            // equation. The minus sits just above the bar and the picked answer
            // sits just below the bar.
            const bracketY = t.bottom + 30;
            const leftX = t.cx;
            const rightX = s.cx;
            const bracket = `<path d="M ${leftX} ${t.bottom + 4} L ${leftX} ${bracketY} L ${rightX} ${bracketY} L ${rightX} ${s.bottom + 4}" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;

            const midX = (leftX + rightX) / 2;
            minus.style.left = `${midX}px`;
            minus.style.top = `${bracketY - 8}px`;
            minus.style.transform = 'translate(-50%, -100%)';
            result.style.left = `${midX}px`;
            result.style.top = `${bracketY + 10}px`;
            result.style.transform = 'translateX(-50%)';

            // Then the ones digit and that result are joined by a second
            // bracket, with a plus above the bar and the final answer below it.
            const rr = result.getBoundingClientRect();
            const r = rel(rr);
            const plusY = r.bottom + 24;
            const plusLeftX = o.cx;
            const plusRightX = r.cx;
            const plusBracket = `<path d="M ${plusLeftX} ${o.bottom + 4} L ${plusLeftX} ${plusY} L ${plusRightX} ${plusY} L ${plusRightX} ${r.bottom + 4}" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;

            svg.innerHTML =
                line(m.cx, m.bottom + 2, o.cx, o.top, '#a78bfa') +
                line(m.cx, m.bottom + 2, t.cx, t.top, '#a78bfa') +
                bracket +
                plusBracket;

            const plusMidX = (plusLeftX + plusRightX) / 2;
            plus.style.left = `${plusMidX}px`;
            plus.style.top = `${plusY - 8}px`;
            plus.style.transform = 'translate(-50%, -100%)';
            total.style.left = `${plusMidX}px`;
            total.style.top = `${plusY + 10}px`;
            total.style.transform = 'translateX(-50%)';
        }

        // --- STAGE 15: 平十法準備 (兩步拆數連減) ---
        // One question has two picks, e.g. 14 - 6:
        //   1) 6 = 4 + ?   -> 2
        //   2) 10 - 2 = ?  -> 8
        function generateStage15(formulaBox, visualArea, optionsBox) {
            const ones = randomInt(2, 5);
            const minuend = 10 + ones;
            const remain = randomInt(2, 4);
            const subtrahend = ones + remain;
            const total = 10 - remain;

            currentQuestion = {
                kind: 'pingTenPrep',
                step: 1,
                minuend,
                subtrahend,
                ones,
                remain,
                total,
                ans: remain,
            };

            renderPingTenPrepStep(1);
        }

        function renderPingTenPrepStep(step) {
            const q = currentQuestion;
            if (!q || q.kind !== 'pingTenPrep') return;

            const optionsBox = document.getElementById('answer-options');
            if (!optionsBox) return;

            q.step = step;
            answerLocked = false;
            hideHint();

            let prompt = '';

            if (step === 1) {
                q.ans = q.remain;
                renderPingTenDiagram(q, step, `<strong class="text-rose-600">${q.subtrahend}</strong> 可以分成 <strong class="text-amber-600">${q.ones}</strong> 同幾多？<span class="text-slate-400">(${q.minuend} - ${q.ones} = 10)</span>`);

                currentHintSpeechText = `${q.subtrahend} 可以分成 ${q.ones} 同 ${q.remain}。因為 ${q.minuend} 減 ${q.ones} 等於 10，所以先減 ${q.ones}，再減 ${q.remain}。`;
                document.getElementById('hint-content').innerHTML = `
                    <div class="flex flex-col items-center gap-2">
